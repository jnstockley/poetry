name: Python 3.10

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile310
      - requirements.txt
      - .github/workflows/deploy-3.10.yml

  push:
    branches:
      - main
    paths:
      - Dockerfile310
      - requirements.txt
      - .github/workflows/deploy-3.10.yml
jobs:
  deploy:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "oidc"
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: "https://secrets.jstockley.com"
          project-slug: ${{ github.event.repository.name }}
          env-slug: "prod"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Log in to Docker Hardened Hub
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: jnstockley
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for metadata
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile310
          load: true
          tags: poetry-metadata:local

      - name: Get image versions
        run: |
          docker run --rm --entrypoint python poetry-metadata:local -c \
            'import platform; from importlib.metadata import version; print("PYTHON_VERSION=" + platform.python_version()); print("POETRY_VERSION=" + version("poetry"))' >> "$GITHUB_ENV"

      - name: Generate RFC 3339 datetime
        id: generate-datetime
        run: |
          RFC3339_DATETIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "RFC3339_DATETIME=$RFC3339_DATETIME" >> "$GITHUB_ENV"

      - name: Extract metadata for pull request (testing)
        if: github.event_name == 'pull_request'
        run: |
          echo "tags=jnstockley/poetry:testing-python3.10,jnstockley/poetry:testing-python${{ env.PYTHON_VERSION }},jnstockley/poetry:testing-${{ env.POETRY_VERSION }}-python${{ env.PYTHON_VERSION }},ghcr.io/jnstockley/poetry:testing-python3.10,ghcr.io/jnstockley/poetry:testing-python${{ env.PYTHON_VERSION }},ghcr.io/jnstockley/poetry:testing-${{ env.POETRY_VERSION }}-python${{ env.PYTHON_VERSION }}" >> "$GITHUB_ENV"

      - name: Extract metadata for push (prod)
        if: github.event_name == 'push'
        run: |
          echo "tags=jnstockley/poetry:latest-python3.10,jnstockley/poetry:latest-python${{ env.PYTHON_VERSION }},jnstockley/poetry:${{ env.POETRY_VERSION }}-python${{ env.PYTHON_VERSION }},ghcr.io/jnstockley/poetry:latest-python3.10,ghcr.io/jnstockley/poetry:latest-python${{ env.PYTHON_VERSION }},ghcr.io/jnstockley/poetry:${{ env.POETRY_VERSION }}-python${{ env.PYTHON_VERSION }}" >> "$GITHUB_ENV"

      - name: Add Poetry version aliases
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          prefix=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            prefix="testing-"
          fi
          for registry in jnstockley/poetry ghcr.io/jnstockley/poetry; do
            for poetry_version in "${POETRY_VERSION%%.*}" "${POETRY_VERSION%.*}" "$POETRY_VERSION"; do
              for python_version in "3.10" "$PYTHON_VERSION"; do
                tags+=",${registry}:${prefix}${poetry_version}-python-${python_version}"
              done
            done
          done
          echo "tags=$tags" >> "$GITHUB_ENV"

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile310
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.created=${{ env.RFC3339_DATETIME }}
            org.opencontainers.image.version=${{ env.POETRY_VERSION }}
            org.opencontainers.image.revision=${{ env.POETRY_VERSION }}-python${{ env.PYTHON_VERSION }}
            org.opencontainers.image.ref.name=${{ env.POETRY_VERSION }}
            org.opencontainers.image.description=Poetry ${{ env.POETRY_VERSION }} using Python ${{ env.PYTHON_VERSION }}
          tags: ${{ env.tags }}
